[project]
name = "tomorrow-lab-github-io"
version = "1.1.0"
description = "Quarto blog for tomorro-lab.github.io"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["*.py", "*.ipynb"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "UP",
  "I",
  "C4",
  "W",
]
ignore = [
  "F403",
  "F405",
  "E501",
  "E402",
  "W605",
  "F811",
  "F821",
]
fixable = ["A", "B", "C", "D", "E", "F", "I", "UP"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
".pixi/*" = ["E"]
".venv/*" = ["E"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.tasks]
start = "quarto publish gh-pages"
preview = "quarto preview"
fix = "ruff check --fix ."

[tool.pixi.dependencies]
python = "==3.11"
quarto = ">=1.9.38,<2"
ruff = ">=0.16.10,<0.17"
jupyter = ">=1.1.1,<2"
matplotlib = ">=3.11.2,<4"
pandas = ">=3.0.6,<4"
plotly = ">=7.1.0,<8"
pixi-kernel = ">=0.7.1,<0.8"
ipykernel = ">=7.4.0,<8"
r-irkernel = ">=1.3.2,<2"
jupytext = ">=1.19.5,<2"
r-knitr = ">=1.52,<2"
r-rmarkdown = ">=2.32,<3"
scikit-learn = ">=1.9.1,<2"
